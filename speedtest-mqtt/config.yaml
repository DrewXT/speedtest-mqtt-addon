name: "Speedtest MQTT"
description: "Runs Ookla Speedtest CLI on a schedule and publishes results to MQTT with Home Assistant discovery support."
version: "1.0.0"
slug: "speedtest_mqtt"
init: false
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386

homeassistant_api: false
hassio_api: false

options:
  mqtt_host: "core-mosquitto"
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
  mqtt_topic_prefix: "speedtest"
  interval_minutes: 30
  speedtest_server_id: 0
  unit_of_measurement: "Mbps"
  discovery_prefix: "homeassistant"
  discovery_enabled: true

schema:
  mqtt_host: str
  mqtt_port: int
  mqtt_username: str
  mqtt_password: str
  mqtt_topic_prefix: str
  interval_minutes: int
  speedtest_server_id: int
  unit_of_measurement: list(Mbps|Kbps|Bps)
  discovery_prefix: str
  discovery_enabled: bool
